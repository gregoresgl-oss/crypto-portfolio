<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>GGWALL — Συντήρηση</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#05060a;
    --bg2:#0a0c14;
    --ink:#e8e2d2;
    --ink-dim:#a39e8d;
    --ink-faint:#5a564a;
    --gold:#e6b756;
    --gold-soft:#c79a3d;
    --gold-glow:rgba(230,183,86,.35);
    --line:rgba(230,183,86,.16);
    --panel:rgba(15,16,22,.7);
    --good:#7be0a8;
    --warn:#e6b756;
    --bad:#e07a7a;
    --accent:var(--gold);
    --accent-rgb:230,183,86;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Manrope',-apple-system,system-ui,sans-serif;
    overflow:hidden;cursor:default;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb),.06), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(var(--accent-rgb),.04), transparent 60%),
      linear-gradient(180deg,#05060a 0%, #08090f 50%, #05060a 100%);
  }

  /* Stars layers */
  .stars{
    position:fixed;inset:0;pointer-events:none;
  }

  /* Center stage */
  #app{position:fixed;inset:0;z-index:5}
  .stage{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:72px 24px 140px;
  }

  /* Top brand row */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px;z-index:30;pointer-events:none;
  }
  .brand{
    display:flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.32em;color:var(--ink-dim);text-transform:uppercase;
  }
  .brand .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .ver{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;
    color:var(--ink-faint);text-transform:uppercase;
  }
  .ver b{color:var(--accent);font-weight:500}

  /* Cosmos centerpiece */
  .cosmos-wrap{
    position:relative;
    width:min(520px, 60vh, 80vw);
    aspect-ratio:1;
    margin:0 auto;
  }
  .cosmos{
    position:absolute;inset:0;
  }
  .orbit{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:.5px solid rgba(230,183,86,.16);
    pointer-events:none;
  }
  .planet{
    position:absolute;
    width:var(--sz,10px);
    height:var(--sz,10px);
    border-radius:50%;
    background:var(--c,#fff);
    transform:translate(-50%,-50%);
    box-shadow:
      0 0 8px var(--c,#fff),
      0 0 16px rgba(255,255,255,.2),
      inset -2px -2px 4px rgba(0,0,0,.4);
    pointer-events:none;
  }
  .planet-label{
    position:absolute;left:50%;top:calc(var(--sz,10px)/2 + 8px);
    transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;
    color:var(--ink-faint);text-transform:uppercase;white-space:nowrap;
  }
  .core{
    position:absolute;left:50%;top:50%;
    width:64px;height:64px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, var(--gold-soft) 40%, transparent 70%);
    animation:coreBreathe 4s ease-in-out infinite;
  }
  .core::before{
    content:'';position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, transparent 30%, rgba(0,0,0,.6) 60%);
  }
  .core::after{
    content:'';position:absolute;left:50%;top:50%;
    width:14px;height:14px;
    transform:translate(-50%,-50%);
    background:#000;border-radius:50%;
  }
  @keyframes coreBreathe{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}
    50%{transform:translate(-50%,-50%) scale(1.08);opacity:.85}
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.85)}
  }

  /* Wordmark */
  .wordmark{
    margin-top:clamp(12px, 2.5vh, 28px);
    font-family:'Cinzel',serif;font-weight:600;
    font-size:clamp(24px,4.5vw,46px);
    letter-spacing:.32em;color:var(--ink);
    text-transform:uppercase;
    text-align:center;
  }
  .wordmark span.accent{color:var(--accent)}

  .tagline{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.4em;
    color:var(--ink-faint);text-transform:uppercase;text-align:center;
  }

  .status-banner{
    margin-top:clamp(14px, 2.2vh, 24px);
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;
    background:rgba(var(--accent-rgb),.08);
    border:.5px solid var(--accent);
    border-radius:99px;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;
    color:var(--accent);text-transform:uppercase;
  }
  .status-banner .ind{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite;
  }

  /* Countdown */
  .countdown{
    margin-top:clamp(16px, 2.5vh, 32px);
    display:flex;gap:12px;align-items:flex-end;justify-content:center;
  }
  .cd-cell{
    position:relative;
    min-width:clamp(86px, 12vw, 124px);
    padding:clamp(10px,1.6vh,16px) 12px clamp(8px,1.2vh,12px);
    background:linear-gradient(180deg, rgba(20,18,14,.65), rgba(10,11,15,.85));
    border:.5px solid var(--line);
    border-radius:14px;
    backdrop-filter:blur(8px);
    text-align:center;
    box-shadow:
      inset 0 1px 0 rgba(var(--accent-rgb),.08),
      0 8px 32px rgba(0,0,0,.4);
  }
  .cd-cell::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:32px;height:1px;background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .cd-num{
    font-family:'JetBrains Mono',monospace;font-weight:300;
    font-size:clamp(32px,5vw,56px);
    letter-spacing:-.02em;color:var(--ink);
    line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 0 24px rgba(var(--accent-rgb),.2);
  }
  .cd-lbl{
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.3em;
    color:var(--ink-faint);text-transform:uppercase;
  }
  .cd-sep{
    color:var(--accent);font-family:'JetBrains Mono',monospace;
    font-size:clamp(32px,5vw,56px);font-weight:300;line-height:1;
    padding-bottom:clamp(24px,4vh,34px);opacity:.4;
  }

  /* Custom message (admin) */
  .custom-msg{
    margin-top:clamp(16px, 2.2vh, 24px);
    font-family:'Manrope',sans-serif;font-size:13px;font-weight:400;
    color:var(--ink-dim);text-align:center;
    max-width:560px;line-height:1.6;
    padding:0 24px;
    opacity:0;
    transition:opacity .8s ease;
  }
  .custom-msg.show{opacity:1}

  /* Bottom info row */
  .info-row{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 24px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    z-index:20;pointer-events:none;
  }
  .info-row > *{pointer-events:auto}

  .progress{
    flex:1;max-width:520px;
  }
  .progress-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px;
  }
  .progress-head b{color:var(--accent);font-weight:500}
  .progress-bar{
    position:relative;height:3px;background:rgba(255,255,255,.06);border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg, transparent, var(--accent));
    box-shadow:0 0 12px var(--accent);
    transition:width .8s ease;
  }
  .progress-fill::after{
    content:'';position:absolute;right:0;top:-2px;bottom:-2px;width:2px;
    background:var(--accent);box-shadow:0 0 12px var(--accent),0 0 24px var(--gold-glow);
  }

  .status-grid{
    display:flex;gap:18px;
  }
  .stat{
    display:flex;flex-direction:column;gap:4px;
    padding:10px 14px;
    background:rgba(15,16,22,.5);
    border:.5px solid rgba(255,255,255,.05);
    border-radius:10px;backdrop-filter:blur(8px);
    min-width:120px;
  }
  .stat-head{
    display:flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.22em;
    color:var(--ink-faint);text-transform:uppercase;
  }
  .stat-head .led{
    width:6px;height:6px;border-radius:50%;
    transition:background .6s ease, box-shadow .6s ease;
  }
  .led-good{background:var(--good);box-shadow:0 0 6px var(--good)}
  .led-warn{background:var(--warn);box-shadow:0 0 6px var(--warn);animation:pulse 1.4s ease-in-out infinite}
  .led-bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}
  .stat-val{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--ink);
    transition:opacity .4s ease, color .4s ease;
  }
  .stat-val.fade{opacity:0}
  .stat-val.warn{color:var(--warn)}
  .stat-val.good{color:var(--good)}
  .stat-val.bad{color:var(--bad)}

  /* Decorative crosshairs */
  .ch{
    position:fixed;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.2em;pointer-events:none;z-index:25;
  }
  .ch.tl{top:64px;left:32px}
  .ch.tr{top:64px;right:32px;text-align:right}
  .ch.tl::before,.ch.tr::before{
    content:'';display:block;width:12px;height:12px;
    border-top:1px solid var(--line);
    margin-bottom:6px;
  }
  .ch.tl::before{border-left:1px solid var(--line)}
  .ch.tr::before{border-right:1px solid var(--line);margin-left:auto}

  /* Comets / click stars */
  .comet{
    position:fixed;width:3px;height:3px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent),0 0 24px var(--gold-glow);
    pointer-events:none;z-index:15;
    animation:cometFly 1.2s ease-out forwards;
  }
  @keyframes cometFly{
    0%{transform:scale(0);opacity:1}
    20%{transform:scale(1);opacity:1}
    100%{transform:scale(.2) translate(var(--dx,40px),var(--dy,-40px));opacity:0}
  }
  .spark{
    position:fixed;width:2px;height:2px;border-radius:50%;
    background:#fff;box-shadow:0 0 6px var(--accent);
    pointer-events:none;z-index:14;
    animation:sparkFade 1.6s ease-out forwards;
  }
  @keyframes sparkFade{
    0%{transform:scale(0);opacity:1}
    50%{transform:scale(2);opacity:1}
    100%{transform:scale(0);opacity:0;
      translate:var(--dx,0) var(--dy,0)}
  }

  @media (max-width: 700px){
    .topbar{padding:16px 18px}
    .info-row{flex-direction:column;align-items:stretch;padding:16px}
    .status-grid{justify-content:space-between;gap:8px;flex-wrap:wrap}
    .stat{min-width:0;flex:1}
    .ch{display:none}
    .countdown{gap:6px}
    .cd-cell{min-width:64px;padding:12px 8px 8px}
    .cd-sep{display:none}
  }
</style>
</head>
<body>

<canvas class="stars" id="stars"></canvas>

<div class="topbar">
  <div class="brand"><span class="dot"></span>GGWALL</div>
  <div class="ver"><b>SYS</b> v2.0 · MAINT</div>
</div>

<div class="ch tl">N · 38°02'<br/>SECTOR-04</div>
<div class="ch tr">E · 23°44'<br/>UPLINK · 0x7A</div>

<div id="app">
  <div class="stage">
    <div class="cosmos-wrap" id="cosmosWrap">
      <div class="cosmos" id="cosmos">
        <div class="core"></div>
      </div>
    </div>

    <div class="wordmark">
      <span class="accent">G</span><span>GWAL</span><span class="accent">L</span>
    </div>
    <div class="tagline">COSMOS PORTFOLIO TRACKER</div>

    <div class="status-banner">
      <span class="ind"></span>
      <span>SYSTEM · UNDER MAINTENANCE</span>
    </div>

    <div class="countdown" aria-live="polite">
      <div class="cd-cell">
        <div class="cd-num" id="cdH">00</div>
        <div class="cd-lbl">ΏΡΕΣ</div>
      </div>
      <div class="cd-sep">:</div>
      <div class="cd-cell">
        <div class="cd-num" id="cdM">00</div>
        <div class="cd-lbl">ΛΕΠΤΆ</div>
      </div>
      <div class="cd-sep">:</div>
      <div class="cd-cell">
        <div class="cd-num" id="cdS">00</div>
        <div class="cd-lbl">ΔΕΥΤ.</div>
      </div>
    </div>

    <div class="custom-msg" id="customMsg"></div>
  </div>

  <div class="info-row">
    <div class="progress">
      <div class="progress-head">
        <span>ΠΡΟΟΔΟΣ ΣΥΝΤΉΡΗΣΗΣ</span>
        <b id="progressPct">0.0%</b>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-head" style="margin-top:8px;margin-bottom:0">
        <span style="opacity:.6">EST · <span id="estTime">--:--</span></span>
        <span style="opacity:.6">BUILD · <span id="buildHash">0x000000</span></span>
      </div>
    </div>
    <div class="status-grid" id="statusGrid">
      <div class="stat">
        <div class="stat-head"><span class="led led-warn" id="led0"></span><span id="name0">DATABASE</span></div>
        <div class="stat-val warn" id="val0">SYNCING</div>
      </div>
      <div class="stat">
        <div class="stat-head"><span class="led led-warn" id="led1"></span><span id="name1">API · COSMOS</span></div>
        <div class="stat-val warn" id="val1">REINDEX</div>
      </div>
      <div class="stat">
        <div class="stat-head"><span class="led led-warn" id="led2"></span><span id="name2">NETWORK</span></div>
        <div class="stat-val warn" id="val2">DEGRADED</div>
      </div>
      <div class="stat">
        <div class="stat-head"><span class="led led-warn" id="led3"></span><span id="name3">BLOCKCHAIN</span></div>
        <div class="stat-val warn" id="val3">5/12 DOWN</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const SB_URL = 'https://rzrxulubttnjtxziodib.supabase.co';
const SB_ANON = 'sb_publishable_FA8PX4QT9DfxrhzxqiT_uw_LoXLsM7A';

// Where to redirect when maintenance ends
const HOME_URL = 'index.html';

// Polling interval (ms)
const POLL_INTERVAL = 30000;

// Status rotation interval (ms) — every 5 minutes change 1-2 indicators
const STATUS_ROTATE_INTERVAL = 5 * 60 * 1000;

// Build hash (random per session)
const BUILD_HASH = '0x' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0').toUpperCase();
document.getElementById('buildHash').textContent = BUILD_HASH;

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let appStatus = null;        // Latest from DB
let startedAt = null;        // ms epoch
let estimatedEnd = null;     // ms epoch
let totalDuration = 0;       // ms (estimatedEnd - startedAt)

// ═══════════════════════════════════════════════════════════════
// PLANETS DATA (from design)
// ═══════════════════════════════════════════════════════════════
const PLANETS = [
  { name:'ATOM', orbit: 0.20, size: 8,  color:'#6f7bd0', speed: 1.0,  start: 0   },
  { name:'OSMO', orbit: 0.30, size: 11, color:'#a259e0', speed: 0.7,  start: 75  },
  { name:'JUNO', orbit: 0.40, size: 9,  color:'#f0a468', speed: 0.5,  start: 140 },
  { name:'SAGA', orbit: 0.50, size: 14, color:'#7b8a9e', speed: 0.34, start: 215 },
  { name:'DYM',  orbit: 0.62, size: 7,  color:'#e6c1a8', speed: 0.22, start: 300 },
];

// ═══════════════════════════════════════════════════════════════
// STATUS STAGES (5 buckets per indicator, progressive)
// ═══════════════════════════════════════════════════════════════
const STATUS_STAGES = {
  0: { // DATABASE
    name: 'DATABASE',
    stages: [
      { pct: [0, 15],   state: 'bad',  val: 'ERROR' },
      { pct: [15, 30],  state: 'warn', val: 'SYNCING' },
      { pct: [30, 50],  state: 'warn', val: 'INDEXING' },
      { pct: [50, 75],  state: 'warn', val: 'REBUILDING' },
      { pct: [75, 90],  state: 'good', val: 'VERIFYING' },
      { pct: [90, 101], state: 'good', val: 'SYNCED' },
    ]
  },
  1: { // API · COSMOS
    name: 'API · COSMOS',
    stages: [
      { pct: [0, 20],   state: 'bad',  val: 'TIMEOUT' },
      { pct: [20, 40],  state: 'warn', val: 'RETRY' },
      { pct: [40, 60],  state: 'warn', val: 'REINDEX' },
      { pct: [60, 80],  state: 'warn', val: 'SYNCING' },
      { pct: [80, 101], state: 'good', val: 'STABLE' },
    ]
  },
  2: { // NETWORK
    name: 'NETWORK',
    stages: [
      { pct: [0, 10],   state: 'bad',  val: 'OFFLINE' },
      { pct: [10, 30],  state: 'warn', val: 'DEGRADED' },
      { pct: [30, 60],  state: 'warn', val: 'RECONNECT' },
      { pct: [60, 90],  state: 'good', val: 'STABLE' },
      { pct: [90, 101], state: 'good', val: 'OPTIMAL' },
    ]
  },
  3: { // BLOCKCHAIN
    name: 'BLOCKCHAIN',
    stages: [
      { pct: [0, 20],   state: 'bad',  val: '8/12 DOWN' },
      { pct: [20, 40],  state: 'warn', val: '5/12 DOWN' },
      { pct: [40, 60],  state: 'warn', val: '3/12 DOWN' },
      { pct: [60, 80],  state: 'good', val: '11/12 UP' },
      { pct: [80, 101], state: 'good', val: '12 CHAINS' },
    ]
  },
};

// ═══════════════════════════════════════════════════════════════
// SUPABASE HELPER (no SDK — just fetch)
// ═══════════════════════════════════════════════════════════════
async function fetchAppStatus(){
  try{
    const r = await fetch(`${SB_URL}/rest/v1/app_status?id=eq.1&select=*`, {
      headers: {
        'apikey': SB_ANON,
        'Authorization': `Bearer ${SB_ANON}`,
      }
    });
    if(!r.ok) return null;
    const data = await r.json();
    return data[0] || null;
  }catch(e){
    console.warn('[maint] fetchAppStatus failed:', e.message);
    return null;
  }
}

// ═══════════════════════════════════════════════════════════════
// COUNTDOWN
// ═══════════════════════════════════════════════════════════════
function updateCountdown(){
  if(!estimatedEnd) return;

  const now = Date.now();
  const remain = Math.max(0, estimatedEnd - now);

  const h = Math.floor(remain / 3600000);
  const m = Math.floor((remain % 3600000) / 60000);
  const s = Math.floor((remain % 60000) / 1000);

  document.getElementById('cdH').textContent = String(h).padStart(2,'0');
  document.getElementById('cdM').textContent = String(m).padStart(2,'0');
  document.getElementById('cdS').textContent = String(s).padStart(2,'0');

  // Progress
  let progressPct = 0;
  if(totalDuration > 0){
    const elapsed = totalDuration - remain;
    progressPct = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
  }
  document.getElementById('progressPct').textContent = progressPct.toFixed(1) + '%';
  document.getElementById('progressFill').style.width = progressPct + '%';

  // EST display
  const endDate = new Date(estimatedEnd);
  const estTime = endDate.toLocaleTimeString('el-GR', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('estTime').textContent = estTime;

  return { remain, progressPct };
}

// ═══════════════════════════════════════════════════════════════
// STATUS ROTATION (progressive based on % completion)
// ═══════════════════════════════════════════════════════════════
const lastShownStage = [-1, -1, -1, -1];

function pickStageForPct(stages, pct){
  for(const stage of stages){
    if(pct >= stage.pct[0] && pct < stage.pct[1]) return stage;
  }
  return stages[stages.length - 1];
}

function updateStatusIndicator(idx, force = false){
  const config = STATUS_STAGES[idx];
  if(!config) return;

  const { progressPct } = updateCountdown() || { progressPct: 0 };
  const stage = pickStageForPct(config.stages, progressPct);
  const stageIdx = config.stages.indexOf(stage);

  // Skip if already showing this stage (unless forced)
  if(!force && stageIdx === lastShownStage[idx]) return;
  lastShownStage[idx] = stageIdx;

  const valEl = document.getElementById('val' + idx);
  const ledEl = document.getElementById('led' + idx);

  // Fade out
  valEl.classList.add('fade');

  setTimeout(() => {
    // Update text + classes
    valEl.textContent = stage.val;
    valEl.classList.remove('warn', 'good', 'bad');
    valEl.classList.add(stage.state);

    // Update LED
    ledEl.classList.remove('led-warn', 'led-good', 'led-bad');
    ledEl.classList.add('led-' + stage.state);

    // Fade in
    valEl.classList.remove('fade');
  }, 400);
}

function updateAllStatusIndicators(force = false){
  for(let i = 0; i < 4; i++) updateStatusIndicator(i, force);
}

// Rotate 1-2 random indicators every STATUS_ROTATE_INTERVAL
function rotateStatusIndicators(){
  // Pick 1-2 random indicators
  const count = Math.random() < 0.5 ? 1 : 2;
  const indices = [0, 1, 2, 3].sort(() => Math.random() - 0.5).slice(0, count);

  for(const idx of indices){
    // Force-refresh (might re-pick same stage, but the progress changes anyway)
    updateStatusIndicator(idx, true);
  }
}

// ═══════════════════════════════════════════════════════════════
// COSMOS — orbits + planets (vanilla JS animation)
// ═══════════════════════════════════════════════════════════════
function setupCosmos(){
  const wrap = document.getElementById('cosmosWrap');
  const cosmos = document.getElementById('cosmos');

  let size = 480;
  let tick = 0;

  // ResizeObserver
  const ro = new ResizeObserver(entries => {
    for(const e of entries){
      const w = e.contentRect.width;
      if(w > 0){
        size = w;
        rebuildOrbits();
      }
    }
  });
  ro.observe(wrap);

  // Build orbit rings + planet elements
  const orbitEls = [];
  const planetEls = [];
  const labelEls = [];

  for(const p of PLANETS){
    const orbitEl = document.createElement('div');
    orbitEl.className = 'orbit';
    cosmos.appendChild(orbitEl);
    orbitEls.push(orbitEl);

    const planetEl = document.createElement('div');
    planetEl.className = 'planet';
    planetEl.style.setProperty('--sz', p.size + 'px');
    planetEl.style.setProperty('--c', p.color);

    const labelEl = document.createElement('div');
    labelEl.className = 'planet-label';
    labelEl.style.setProperty('--sz', p.size + 'px');
    labelEl.textContent = p.name;
    planetEl.appendChild(labelEl);
    cosmos.appendChild(planetEl);
    planetEls.push(planetEl);
    labelEls.push(labelEl);
  }

  function rebuildOrbits(){
    PLANETS.forEach((p, i) => {
      const orbitEl = orbitEls[i];
      orbitEl.style.width = (size * p.orbit * 2) + 'px';
      orbitEl.style.height = (size * p.orbit * 2) + 'px';
    });
  }
  rebuildOrbits();

  // Animation loop
  let last = performance.now();
  function loop(t){
    const dt = (t - last) / 1000;
    last = t;
    tick += dt;

    const center = size / 2;

    PLANETS.forEach((p, i) => {
      const angle = (tick * p.speed * 30 + p.start) * Math.PI / 180;
      const r = size * p.orbit;
      const x = center + Math.cos(angle) * r;
      const y = center + Math.sin(angle) * r;
      planetEls[i].style.left = x + 'px';
      planetEls[i].style.top = y + 'px';
    });

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════
// STARFIELD
// ═══════════════════════════════════════════════════════════════
function setupStarfield(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let raf, w, h, stars = [], shooters = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const speed = 1, density = 1;
  const accentRgb = '230,183,86';

  function resize(){
    w = c.width = innerWidth * dpr;
    h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    const count = Math.floor((innerWidth * innerHeight / 4500) * density);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      z: Math.random(),
      r: Math.random() * 1.2 + 0.2,
      tw: Math.random() * Math.PI * 2,
      tws: 0.003 + Math.random() * 0.012,
    }));
  }
  resize();
  addEventListener('resize', resize);

  function maybeShoot(){
    if(Math.random() < 0.003 * speed){
      const fromLeft = Math.random() < 0.5;
      shooters.push({
        x: fromLeft ? -50 : w + 50,
        y: Math.random() * h * 0.6,
        vx: (fromLeft ? 1 : -1) * (8 + Math.random() * 6) * dpr * speed,
        vy: (2 + Math.random() * 2) * dpr * speed,
        life: 1,
      });
    }
  }

  function loop(){
    ctx.clearRect(0, 0, w, h);

    for(const s of stars){
      s.tw += s.tws * speed;
      const tw = 0.5 + 0.5 * Math.sin(s.tw);
      const alpha = (0.25 + 0.75 * tw) * (0.4 + s.z * 0.6);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * dpr * (0.6 + s.z * 0.6), 0, Math.PI * 2);
      ctx.fillStyle = s.z > 0.85
        ? `rgba(${accentRgb},${alpha})`
        : `rgba(255,250,235,${alpha * 0.85})`;
      ctx.fill();
    }

    maybeShoot();
    shooters = shooters.filter(sh => {
      sh.x += sh.vx; sh.y += sh.vy;
      sh.life -= 0.008 * speed;
      if(sh.life <= 0) return false;
      const grad = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 8, sh.y - sh.vy * 8);
      grad.addColorStop(0, `rgba(${accentRgb},${sh.life})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.4 * dpr;
      ctx.beginPath();
      ctx.moveTo(sh.x, sh.y);
      ctx.lineTo(sh.x - sh.vx * 8, sh.y - sh.vy * 8);
      ctx.stroke();
      return sh.x > -200 && sh.x < w + 200;
    });

    raf = requestAnimationFrame(loop);
  }
  loop();
}

// ═══════════════════════════════════════════════════════════════
// CLICK COMETS + SPARKS
// ═══════════════════════════════════════════════════════════════
function setupClickComets(){
  document.addEventListener('click', e => {
    const x = e.clientX, y = e.clientY;

    // Comet
    const c = document.createElement('div');
    c.className = 'comet';
    c.style.left = x + 'px';
    c.style.top = y + 'px';
    const dx = (Math.random() - 0.5) * 120;
    const dy = -40 - Math.random() * 120;
    c.style.setProperty('--dx', dx + 'px');
    c.style.setProperty('--dy', dy + 'px');
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1300);

    // Sparks
    for(let i = 0; i < 5; i++){
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const a = (i / 5) * Math.PI * 2 + Math.random();
      const r = 30 + Math.random() * 40;
      s.style.setProperty('--dx', Math.cos(a) * r + 'px');
      s.style.setProperty('--dy', Math.sin(a) * r + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1700);
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// MAINTENANCE STATUS POLLING + SELF-UNLOCK
// ═══════════════════════════════════════════════════════════════
async function checkMaintenance(){
  const status = await fetchAppStatus();
  if(!status){
    // Could not fetch — keep showing maintenance to be safe
    console.warn('[maint] Could not fetch status, retrying...');
    return;
  }

  // CASE 1: Maintenance disabled → redirect to home
  if(!status.maintenance_active){
    console.log('[maint] Maintenance OFF — redirecting to', HOME_URL);
    window.location.href = HOME_URL;
    return;
  }

  appStatus = status;

  // Update timing
  startedAt = status.started_at ? new Date(status.started_at).getTime() : Date.now();
  estimatedEnd = status.estimated_end ? new Date(status.estimated_end).getTime() : null;
  totalDuration = (estimatedEnd && startedAt) ? (estimatedEnd - startedAt) : 0;

  // Update custom message
  const msg = (status.maintenance_message || '').trim();
  const msgEl = document.getElementById('customMsg');
  if(msg){
    msgEl.textContent = msg;
    msgEl.classList.add('show');
  }else{
    msgEl.classList.remove('show');
    msgEl.textContent = '';
  }

  // CASE 2: ETA passed and pg_cron hasn't unlocked yet — wait for next poll
  // (We do NOT self-unlock from frontend; pg_cron handles that server-side)
  if(estimatedEnd && estimatedEnd <= Date.now()){
    console.log('[maint] ETA passed, waiting for cron unlock...');
  }

  // Update display immediately
  updateCountdown();
  updateAllStatusIndicators(true);
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
async function init(){
  setupStarfield();
  setupCosmos();
  setupClickComets();

  // First check
  await checkMaintenance();

  // Countdown ticker — every 1s
  setInterval(updateCountdown, 1000);

  // Status indicator update — based on countdown progress
  // (Initial population)
  updateAllStatusIndicators(true);

  // Status rotation — random 1-2 indicators every 5min
  setInterval(rotateStatusIndicators, STATUS_ROTATE_INTERVAL);

  // Polling — check DB every 30s
  setInterval(checkMaintenance, POLL_INTERVAL);
}

// Block scroll/drag/zoom hard
addEventListener('wheel', e => e.preventDefault(), { passive: false });
addEventListener('touchmove', e => {
  if(e.touches.length > 1) e.preventDefault();
}, { passive: false });
addEventListener('keydown', e => {
  if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key)){
    e.preventDefault();
  }
});

init();
</script>
